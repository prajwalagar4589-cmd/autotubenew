name: Daily Short Pipeline

on:
  schedule:
    - cron: '30 12 * * *'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract autotubefinal.zip if exists
        run: |
          if [ -f autotubefinal.zip ]; then
            echo "Unzipping autotubefinal.zip..."
            unzip -o autotubefinal.zip
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run pipeline script
        run: |
          if [ -f main.py ]; then
            python main.py
          elif [ -f daily_short.py ]; then
            python daily_short.py
          elif [ -f run.py ]; then
            python run.py
          elif [ -f app.py ]; then
            python app.py
          else
            echo "Searching for python scripts..."
            find . -maxdepth 2 -name "*.py"
            python $(find . -maxdepth 2 -name "*.py" | head -n 1)
          fi
